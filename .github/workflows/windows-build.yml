name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check application
        run: pnpm check

      - name: Validate desktop configuration
        run: pnpm desktop:validate

      - name: Build Windows installer and portable executable
        run: pnpm desktop:package

      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath dynamo-exporter-windows.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamo-exporter-windows
          path: dynamo-exporter-windows.zip
          if-no-files-found: error
          retention-days: 30
